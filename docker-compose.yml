services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coworkhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coworkhub}
      POSTGRES_DB: ${POSTGRES_DB:-hub1z_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworkhub -d coworkhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment: &app-env
      FLASK_ENV: ${FLASK_ENV:-development}
      APP_NAME: ${APP_NAME:-hub1z}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-hub1z.com}
      PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-admin@hub1z.com}
      PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:-ChangeMe123!}
      PLATFORM_SUPPORT_EMAIL: ${PLATFORM_SUPPORT_EMAIL:-support@hub1z.com}
      DEPLOY_MODE: ${DEPLOY_MODE:-shared}
      OPERATOR_TRIAL_DAYS: ${OPERATOR_TRIAL_DAYS:-14}
      ENTITLEMENTS_SHADOW_ENABLED: ${ENTITLEMENTS_SHADOW_ENABLED:-false}
      ENTITLEMENTS_ENFORCEMENT_ENABLED: ${ENTITLEMENTS_ENFORCEMENT_ENABLED:-false}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-coworkhub}:${POSTGRES_PASSWORD:-coworkhub}@db:5432/${POSTGRES_DB:-hub1z_db}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/app/var/uploads}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PLATFORM_BUCKET: ${AWS_S3_PLATFORM_BUCKET:-}
      AWS_S3_OPERATOR_BUCKET: ${AWS_S3_OPERATOR_BUCKET:-}
      AWS_S3_URL_TTL: ${AWS_S3_URL_TTL:-3600}
      SEED_DEMO: ${SEED_DEMO:-true}
      MAIL_SERVER: ${MAIL_SERVER:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-no-reply@hub1z.com}
      MAIL_SUPPRESS_SEND: ${MAIL_SUPPRESS_SEND:-false}
      MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO-admin@hub1z.com}
      MAIL_REDIRECT_KEEP_DOMAINS: ${MAIL_REDIRECT_KEEP_DOMAINS-hub1z.com}
      MAIL_CREDENTIALS_SECRET_NAME: ${MAIL_CREDENTIALS_SECRET_NAME:-}
    volumes:
      - uploads:/app/var
    command: >-
      sh -c "flask --app wsgi.py db upgrade &&
      if [ \"$${SEED_DEMO}\" = \"true\" ]; then flask --app wsgi.py seed-demo; fi &&
      gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 60 wsgi:app"

  # Runs the clock-driven jobs (invoices, credits, agreements, recurring bookings, no-shows).
  # Every job is safe to repeat, so a restart never double-bills.
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment: *app-env
    healthcheck:
      disable: true
    volumes:
      - uploads:/app/var
    command: >-
      sh -c "n=0; while true; do
      if [ $$((n % 12)) -eq 0 ]; then flask --app wsgi.py run-scheduled-jobs;
      else flask --app wsgi.py release-no-shows; fi;
      n=$$((n + 1)); sleep 300; done"

volumes:
  pgdata:
  uploads:
