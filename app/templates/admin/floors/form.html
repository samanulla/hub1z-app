{% extends "base.html" %}
{% from "_macros.html" import field %}
{% block title %}New floor{% endblock %}

{% block content %}
{% include "admin/_inventory_nav.html" %}
<h3>Add floor to {{ location.name }}</h3>
<div class="card"><div class="card-body">
  <form method="post" novalidate>
    {{ form.hidden_tag() }}
    <div class="row">
      <div class="col-md-3">{{ field(form.level) }}</div>
      <div class="col-md-9">{{ field(form.name) }}</div>
    </div>
    <button class="btn btn-dark">Save</button>
    <a class="btn btn-link" href="{{ url_for('admin.location_detail', location_id=location.id) }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
