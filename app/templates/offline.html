<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You are offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Inter, system-ui, -apple-system, sans-serif; color: #151a2d; background: #f6f7fb; text-align: center; }
    .box { padding: 32px; max-width: 360px; }
    .ico { width: 64px; height: 64px; border-radius: 18px; background: #eeeefc; color: #5b5bd6; display: grid; place-items: center; margin: 0 auto 18px; font-size: 30px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #5a6278; margin: 0 0 22px; line-height: 1.5; }
    button { border: 0; background: #5b5bd6; color: #fff; font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">&#8635;</div>
    <h1>You are offline</h1>
    <p>Check your internet connection. Your bookings and check-in QR will be here when you are back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
