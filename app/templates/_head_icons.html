{% set _app_name = operator.name if operator else 'Hub1z' %}
{% if operator and operator.logo_url %}
<link rel="icon" href="{{ operator.logo_url }}">
{% elif operator %}
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('pwa.icon', size=32) }}">
{% else %}
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/brand/hub1z-icon.svg') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/brand/favicon-32.png') }}">
{% endif %}
<link rel="apple-touch-icon" href="{{ url_for('pwa.icon', size=180) if operator else url_for('static', filename='img/brand/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('pwa.manifest') }}">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{ _app_name }}">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
