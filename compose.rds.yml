# Production override: use Amazon RDS instead of the bundled PostgreSQL container.
# Use with: docker compose -f docker-compose.yml -f compose.rds.yml <command>
# DATABASE_URL comes from the protected .env (never commit it).
services:
  db:
    profiles: [local-db]
  web:
    depends_on: !reset []
    ports: !override
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the production RDS DATABASE_URL in .env}
      SEED_DEMO: "false"
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
    volumes:
      - ./certs:/app/certs:ro
  scheduler:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the production RDS DATABASE_URL in .env}
      SEED_DEMO: "false"
      MARKETPLACE_ENABLED: ${MARKETPLACE_ENABLED:-false}
    volumes:
      - ./certs:/app/certs:ro
