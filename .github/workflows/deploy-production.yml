name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hub1z-deploy]
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy main to production
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          chmod 600 "$key" "$hosts"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          remote_script="/tmp/hub1z-deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sh"
          options=(-i "$key" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts")
          scp "${options[@]}" scripts/deploy.sh "ec2-user@$DEPLOY_HOST:$remote_script"
          printf -v command 'bash %q production main %q; result=$?; rm -f %q; exit "$result"' "$remote_script" "$SOURCE_SHA" "$remote_script"
          ssh "${options[@]}" "ec2-user@$DEPLOY_HOST" "$command"